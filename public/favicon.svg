<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="suomiShieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#002F6C" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="auroraGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="32" y1="14" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00D2FF" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Shield Base -->
  <rect width="64" height="64" rx="16" fill="url(#suomiShieldGrad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Geometric Nordic Shield & Faceted 'S' Crest -->
  <g filter="url(#glow)">
    <!-- Top Nordic Wing / S-curve Upper Facet -->
    <path
      d="M32 12L46 19.5V31C46 41.5 39.5 48.5 32 52C24.5 48.5 18 41.5 18 31V19.5L32 12Z"
      stroke="url(#auroraGrad)"
      stroke-width="2.5"
      stroke-linejoin="round"
      fill="#0B132B"
      fill-opacity="0.75"
    />

    <!-- Stylized Geometric S Ribbon & Cross Interlock -->
    <!-- Upper S Hook -->
    <path
      d="M40 22C40 22 36.5 18.5 31 18.5C25.5 18.5 23 22 23 25.5C23 30 28 31.5 33 33.5C38 35.5 41 38 41 42.5C41 47 37 50 31.5 50C25 50 21.5 45.5 21.5 45.5"
      stroke="url(#accentGrad)"
      stroke-width="3.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Central Security Core & Verification Node -->
    <circle cx="32" cy="32" r="3.5" fill="#00D2FF" />
    <circle cx="32" cy="32" r="1.5" fill="#FFFFFF" />

    <!-- Nordic Cross Subtle Overlay -->
    <path
      d="M27 22H37M27 42H37"
      stroke="#38BDF8"
      stroke-opacity="0.6"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </g>
</svg>
