<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none">
  <defs>
    <linearGradient id="logoShieldGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#002F6C" />
      <stop offset="100%" stop-color="#0052CC" />
    </linearGradient>
    <linearGradient id="logoAuroraGrad" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="grcBadgeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00D2FF" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Emblem Icon (x: 0, y: 4, 56x56) -->
  <g transform="translate(4, 4)">
    <rect width="56" height="56" rx="14" fill="url(#logoShieldGrad)" />
    <rect x="0.75" y="0.75" width="54.5" height="54.5" rx="13.25" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1.5" />

    <g filter="url(#logoGlow)" transform="translate(4, 4) scale(0.75)">
      <!-- Shield Outline -->
      <path
        d="M32 10L48 18.5V32C48 43 40.5 50.5 32 54C23.5 50.5 16 43 16 32V18.5L32 10Z"
        stroke="url(#logoAuroraGrad)"
        stroke-width="3"
        stroke-linejoin="round"
        fill="#080E1E"
        fill-opacity="0.8"
      />

      <!-- Geometric S Ribbon -->
      <path
        d="M41 21C41 21 37 17.5 31 17.5C24.5 17.5 22 21.5 22 25.5C22 30.5 27.5 32.5 33 34.5C38.5 36.5 41.5 39.5 41.5 44C41.5 49 37 52.5 30.5 52.5C23.5 52.5 20 47.5 20 47.5"
        stroke="#FFFFFF"
        stroke-width="4"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Verification Core -->
      <circle cx="32" cy="35" r="4" fill="#00D2FF" />
      <circle cx="32" cy="35" r="1.8" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Typography: suomi + GRC Badge -->
  <!-- "suomi" -->
  <text x="74" y="38" font-family="'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#0F172A" letter-spacing="-0.5px">suomi</text>

  <!-- "GRC" Badge -->
  <rect x="156" y="16" width="58" height="26" rx="6" fill="url(#grcBadgeGrad)" />
  <text x="185" y="34" font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1px">GRC</text>

  <!-- Tagline / Subtitle -->
  <text x="75" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="0.5px">CONTINUOUS ASSURANCE &amp; TRUST</text>
</svg>
